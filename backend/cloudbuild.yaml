steps:
  # Build container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api:$SHORT_SHA'
      - '-t'
      - 'europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api:latest'
      - '.'
    dir: 'backend'

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'awm-chat-api'
      - '--image=europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=awm-chat-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=^|^GCP_PROJECT=$PROJECT_ID|GCS_ARCHIVE_BUCKET=awm-chat-archive|ALLOWED_EMAIL_DOMAIN=ascotwm.com|CORS_ORIGINS=https://chat.chimerasportstrading.com,https://awm-chat.pages.dev'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api:$SHORT_SHA'
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/awm-chat/api:latest'
